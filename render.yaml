services:
  # ─── API (Bun + Elysia) ─────────────────────────────────────────
  - type: web
    name: smik-api
    env: bun
    region: frankfurt  # Change to 'ohio' or 'oregon' if you prefer US servers
    plan: free
    # No rootDir — build runs from monorepo root to access all workspace packages
    buildCommand: "bun install && cd packages/database && bunx prisma generate"
    startCommand: "bun --cwd apps/api index.ts"
    envVars:
      - key: DATABASE_URL
        sync: false  # Set this manually in Render dashboard from Neon
      - key: ALLOWED_ORIGINS
        sync: false  # Set this after getting your Vercel URL, e.g.: https://smik-party.vercel.app
      - key: NODE_ENV
        value: production
