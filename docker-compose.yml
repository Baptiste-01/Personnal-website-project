version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smik-db
    restart: always
    environment:
      POSTGRES_USER: smik_user
      POSTGRES_PASSWORD: smik_password
      POSTGRES_DB: smik_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
